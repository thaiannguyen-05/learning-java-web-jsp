<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /*relative can be use for using top left right bottom to move the element*/
        /* #box1 {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            position: relative;
            top: 100px;
        } */


        /* fixed can be use for making the element fixed to the screen with top, bottom, left, right*/
        /* #box1 {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            position: fixed;
            right: 0px;
        }    */

        #box1 {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            position: relative;
        }

        #box2 {
            width: 50px;
            height: 50px;
            background-color: rgb(145, 122, 74);
            position: absolute;
        }

        /* sticky giong fixed , cung treo nhung se chi treo khi cuon den do va fixed la dang chen len tren con sticky se khong chung dong voi cac element*/
        #box3 {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            position: sticky;
            top: 0px;
        }
    </style>



</head>

<body>
    <div id="box1">
        <div id="box2"></div>

    </div>



</body>

</html>
